<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Gemba email signature template</title></head>
<body style="margin:8px;background-color:#FFFFFF;">
<!-- Replace {{NAME}}, {{ROLE}} and both occurrences of {{EMAIL}} before installation. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="288" bgcolor="#FFFFFF" style="width:288px;max-width:100%;border-collapse:collapse;background-color:#FFFFFF;color:#1B112A;">
  <tr><td style="padding:0;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="288" style="width:288px;border-collapse:collapse;">
      <tr>
        <td width="76" style="width:76px;padding:0;vertical-align:middle;"><a href="https://www.gembagroup.co.uk/" style="text-decoration:none;"><img src="https://thekaizenking.github.io/email-signatures/assets/v1/gemba-signature-tile.png" alt="Gemba" width="76" height="76" border="0" style="display:block;width:76px;height:76px;border:0;" /></a></td>
        <td width="14" style="width:14px;font-size:0;line-height:0;">&nbsp;</td>
        <td style="padding:0;vertical-align:middle;">
          <div style="font-family:Urbanist,Arial,Helvetica,sans-serif;font-size:22px;line-height:27px;font-weight:600;letter-spacing:-0.3px;color:#1B112A;">{{NAME}}</div>
          <div style="font-family:'Nunito Sans',Arial,Helvetica,sans-serif;font-size:12px;line-height:21px;font-weight:400;color:#665D70;">{{ROLE}}</div>
          <div style="font-family:'Nunito Sans',Arial,Helvetica,sans-serif;font-size:11px;line-height:18px;font-weight:400;letter-spacing:1.2px;color:#79259B;">GEMBA GROUP</div>
        </td>
      </tr>
    </table>
  </td></tr>
  <tr><td height="16" style="height:16px;font-size:0;line-height:0;">&nbsp;</td></tr>
  <tr><td height="3" bgcolor="#79259B" style="height:3px;background-color:#79259B;font-size:0;line-height:0;">&nbsp;</td></tr>
  <tr><td style="padding:11px 0 0;font-family:'Nunito Sans',Arial,Helvetica,sans-serif;font-size:12px;line-height:20px;font-weight:400;"><a href="mailto:{{EMAIL}}" style="color:#1B112A;text-decoration:none;">{{EMAIL}}</a></td></tr>
  <tr><td style="padding:5px 0 0;font-family:'Nunito Sans',Arial,Helvetica,sans-serif;font-size:12px;line-height:20px;font-weight:400;"><a href="https://www.gembagroup.co.uk/" style="font-weight:700;color:#79259B;text-decoration:none;">Gemba website</a><span style="color:#665D70;"> &nbsp;/&nbsp; </span><a href="https://www.linkedin.com/company/gemba-group" style="color:#79259B;text-decoration:none;">LinkedIn</a></td></tr>
</table>
</body></html>
